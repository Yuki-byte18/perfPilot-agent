# PerfPilot 自己的 CI。
#
# 这里跑的是**这个工具自己**的检查（风格 / 循环依赖 / 类型 / 构建 / 测试），
# 不是性能门禁 —— 性能门禁是给使用者的项目用的，由 `perfpilot init --ci github`
# 生成到使用者仓库里（GitLab 版模板见 ci/gitlab-perfpilot.yml）。
#
# 之前这里放的是"PerfPilot 给自己跑性能门禁"，那个配置**永远不可能通过**：
# 本仓库没有 `.perfpilot.yml`，也没有可以测量的网页（这是个工具，不是网站）。
# 一份永远红的流水线比没有流水线更糟 —— 它会让真正的红色也被忽略。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消上一次：省 runner，也避免两个 job 互相抢 CPU
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # 版本与 package.json 的 `packageManager` 对齐：
      # pnpm 11 的 lockfile 与 store 格式都和 10 不同，装错版本会直接失败
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          # node:sqlite 在 22.13 之前还在 --experimental-sqlite 后面
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码风格与依赖边界
        run: pnpm lint

      - name: 无循环依赖
        run: pnpm cycles

      - name: 类型
        run: pnpm typecheck

      # 顺序是刻意的：先构建再测试。
      # 报告页的体积预算测试（web/src/perf.test.ts）要看构建产物，
      # 没构建时它会跳过断言 —— 在 CI 里必须让它真的跑起来。
      - name: 构建
        run: pnpm build

      - name: 测试（含 70% 覆盖率门禁）
        run: pnpm test:cov
